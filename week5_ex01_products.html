<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="/week5_ex01_style.css">
  </head>
  <body>
    <header>
      <h1>Product Showcase</h1>
      <p>Explore or latest collection of quality items</p>
    </header>
    <main class="product-container">
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product 1">
        <h2>Smart Watch</h2>
        <p class="price">R1499.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product 2">
        <h2>Wireless Headphones</h2>
        <p class="price">R799.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product 3">
        <h2>Laptop Backpack</h2>
        <p class="price">R599.99</p>
        <button>Add to Cart</button>
      </div>
      <div>
        <img src="https://via.placeholder.com/300x200" alt="Product 4">
        <h2>Bluetooth Speaker</h2>
        <p class="price">R999.99</p>
        <button>Add to Cart</button>
      </div>
      <div>
        <img src="https://via.placeholder.com/300x200" alt="Product 5">
        <h2>Case and Screen Protecter</h2>
        <p class="price">R249.99</p>
        <button>Add to Cart</button>
      </div>
      <div>
        <img src="https://via.placeholder.com/300x200" alt="Product 5">
        <h2>Power Bank</h2>
        <p class="price">R749.99</p>
        <button>Add to Cart</button>
      </div>
    </main>
  </body>
</html>
